<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>きょうのTo-do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column like a pocket notebook — date header, input line, ruled task list, quiet footer */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #1b2233;
  --muted: #687089;
  --line: #dde1ea;
  --accent: #2c4bb8;      /* 藍 */
  --accent-soft: #e6ebfa;
  --warn: #b4321f;
  --warn-soft: #fbe9e5;
  --today: #8a5a00;
  --today-soft: #fbf0d6;
  --done: #9aa1b4;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141c; --surface: #191d28; --ink: #e7eaf2; --muted: #9399ad; --line: #2a3040;
    --accent: #8fa6ff; --accent-soft: #232c4a; --warn: #ff8a75; --warn-soft: #3a1f1b;
    --today: #f0c062; --today-soft: #352a12; --done: #5e6579; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141c; --surface: #191d28; --ink: #e7eaf2; --muted: #9399ad; --line: #2a3040;
  --accent: #8fa6ff; --accent-soft: #232c4a; --warn: #ff8a75; --warn-soft: #3a1f1b;
  --today: #f0c062; --today-soft: #352a12; --done: #5e6579; color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 600px; margin: 0 auto; padding: 40px 16px 64px; display: grid; gap: 24px; }

header { display: grid; gap: 4px; }
.date { font-family: var(--font-mono); font-size: 13px; color: var(--muted); letter-spacing: .04em; }
h1 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: .02em; text-wrap: balance; line-height: 1.25; }
.summary { color: var(--muted); font-size: 14px; }
.summary b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

form.add { display: flex; gap: 8px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
form.add input[type=text] { flex: 1 1 220px; min-width: 0; border: 0; background: transparent; font: inherit; color: var(--ink); padding: 8px 10px; outline: none; }
form.add input[type=date] { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 13px; padding: 6px 8px; }
form.add button { border: 0; border-radius: 8px; background: var(--accent); color: var(--surface); font: inherit; font-weight: 700; padding: 8px 18px; cursor: pointer; }
form.add:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.filters { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.filters button { border: 1px solid transparent; background: transparent; color: var(--muted); font: inherit; font-size: 14px; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.filters .spacer { flex: 1; }
.filters .clear { color: var(--muted); font-size: 13px; }
.filters .clear:hover { color: var(--warn); }

ul.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
li.item { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
li.item .check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; color: var(--surface); }
li.item.done .check { background: var(--accent); border-color: var(--accent); }
li.item .check svg { width: 14px; height: 14px; opacity: 0; }
li.item.done .check svg { opacity: 1; }
li.item .text { min-width: 0; overflow-wrap: anywhere; cursor: text; }
li.item.done .text { color: var(--done); text-decoration: line-through; }
li.item .edit { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--accent); border-radius: 6px; padding: 2px 6px; }
.chip { font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; color: var(--muted); background: var(--bg); }
.chip.today { color: var(--today); background: var(--today-soft); }
.chip.late { color: var(--warn); background: var(--warn-soft); }
li.item.done .chip { color: var(--done); background: transparent; }
.del { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; opacity: .55; display: grid; place-items: center; }
.del:hover, .del:focus-visible { opacity: 1; color: var(--warn); }
.del svg { width: 16px; height: 16px; }

.empty { text-align: left; padding: 28px 4px; color: var(--muted); border-bottom: 1px solid var(--line); }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

footer { color: var(--muted); font-size: 12px; display: grid; gap: 4px; }
.hint kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.status { font-size: 12px; }
.status.err { color: var(--warn); }

@media (max-width: 420px) {
  h1 { font-size: 28px; }
  li.item { grid-template-columns: auto 1fr auto; }
  li.item .chip { grid-column: 2; justify-self: start; }
  li.item .del { grid-row: 1; grid-column: 3; }
}
@media (prefers-reduced-motion: no-preference) {
  li.item { transition: background .15s; }
  li.item .check { transition: background .15s, border-color .15s; }
}
</style>

<div class="wrap">
  <header>
    <div class="date" id="today"></div>
    <h1>きょうのTo-do</h1>
    <div class="summary" id="summary">読み込み中…</div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <input type="text" id="newTitle" placeholder="やることを入力（例：請求書を送る）" aria-label="やること" maxlength="200">
    <input type="date" id="newDue" aria-label="期限（任意）">
    <button type="submit" id="addBtn">追加</button>
  </form>

  <div class="filters" role="group" aria-label="表示の切り替え">
    <button type="button" id="f-all" data-f="all" aria-pressed="true">すべて</button>
    <button type="button" id="f-active" data-f="active" aria-pressed="false">未完了</button>
    <button type="button" id="f-done" data-f="done" aria-pressed="false">完了</button>
    <span class="spacer"></span>
    <button type="button" class="clear" id="clearDone">完了済みを削除</button>
  </div>

  <ul class="list" id="list"></ul>

  <footer>
    <div class="hint">項目の文字をクリックすると編集できます。<kbd>Enter</kbd> で確定、<kbd>Esc</kbd> で取り消し。</div>
    <div class="status" id="status"></div>
  </footer>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const WD = ["日","月","火","水","木","金","土"];
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const now = new Date();
  $("today").textContent = now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日（" + WD[now.getDay()] + "）";

  let tasks = [];          // {id, title, done, due, created}
  let filter = "all";
  let store = null;        // adapter
  let editingId = null;

  // ---------- storage adapters ----------
  const LS_KEY = "todo-items-v1";
  function localAdapter() {
    let mem = [];
    try { mem = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { mem = []; }
    const save = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(mem)); } catch (e) {} };
    return {
      kind: "local",
      subscribe(cb) { cb(mem.slice()); this._cb = cb; },
      async add(t) { mem.push(t); save(); this._cb(mem.slice()); },
      async update(id, patch) { mem = mem.map(x => x.id === id ? Object.assign({}, x, patch) : x); save(); this._cb(mem.slice()); },
      async remove(id) { mem = mem.filter(x => x.id !== id); save(); this._cb(mem.slice()); }
    };
  }
  function dbAdapter(db, uid) {
    const col = db.collection("data/users/" + uid);
    return {
      kind: "db",
      subscribe(cb) {
        col.orderBy("created", "asc").onSnapshot(
          (snap) => cb(snap.docs.map(d => Object.assign({ id: d.id }, d.data()))),
          (e) => setStatus("同期できなくなりました。ページを再読み込みしてください。", true)
        );
      },
      async add(t) { const { id, ...body } = t; await col.doc(id).set(body); },
      async update(id, patch) { await col.doc(id).update(patch); },
      async remove(id) { await col.doc(id).delete(); }
    };
  }

  function setStatus(msg, err) { const s = $("status"); s.textContent = msg || ""; s.classList.toggle("err", !!err); }
  function writeFailed() { setStatus("保存できませんでした。もう一度お試しください。", true); }

  // ---------- render ----------
  const checkSvg = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  const trashSvg = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>';

  function dueChip(due, done) {
    if (!due) return null;
    const today = ymd(new Date());
    const t = new Date(); t.setDate(t.getDate() + 1);
    const chip = document.createElement("span");
    chip.className = "chip";
    if (due === today) { chip.textContent = "今日まで"; if (!done) chip.classList.add("today"); }
    else if (due === ymd(t)) { chip.textContent = "明日まで"; }
    else {
      const [y, m, d] = due.split("-").map(Number);
      chip.textContent = m + "/" + d + "まで";
      if (due < today && !done) { chip.classList.add("late"); chip.textContent = m + "/" + d + " 期限切れ"; }
    }
    return chip;
  }

  function render() {
    const list = $("list");
    list.textContent = "";
    const remaining = tasks.filter(t => !t.done).length;
    const total = tasks.length;
    $("summary").innerHTML = total
      ? "残り <b>" + remaining + "</b> 件 ／ 全 <b>" + total + "</b> 件"
      : "まだ何もありません";
    $("clearDone").hidden = !tasks.some(t => t.done);

    const shown = tasks.filter(t => filter === "all" ? true : filter === "active" ? !t.done : t.done);
    if (!shown.length) {
      const li = document.createElement("li");
      li.className = "empty";
      const st = document.createElement("strong");
      const p = document.createElement("span");
      if (!total) { st.textContent = "最初のやることを追加しましょう"; p.textContent = "上の入力欄に書いて「追加」を押すと、ここに並びます。期限は空欄のままでもかまいません。"; }
      else if (filter === "active") { st.textContent = "未完了はありません"; p.textContent = "すべて片づきました。"; }
      else { st.textContent = "完了した項目はまだありません"; p.textContent = "チェックを入れるとここに表示されます。"; }
      li.append(st, p);
      list.append(li);
      return;
    }
    for (const t of shown) {
      const li = document.createElement("li");
      li.className = "item" + (t.done ? " done" : "");
      const cb = document.createElement("button");
      cb.className = "check"; cb.type = "button";
      cb.setAttribute("role", "checkbox");
      cb.setAttribute("aria-checked", t.done ? "true" : "false");
      cb.setAttribute("aria-label", (t.done ? "未完了に戻す：" : "完了にする：") + t.title);
      cb.innerHTML = checkSvg;
      cb.onclick = () => store.update(t.id, { done: !t.done }).catch(writeFailed);

      let textEl;
      if (editingId === t.id) {
        textEl = document.createElement("input");
        textEl.className = "edit"; textEl.id = "edit-" + t.id; textEl.value = t.title; textEl.maxLength = 200;
        textEl.setAttribute("aria-label", "やることを編集");
        const finish = (commit) => {
          if (editingId !== t.id) return;
          editingId = null;
          const v = textEl.value.trim();
          if (commit && v && v !== t.title) store.update(t.id, { title: v }).catch(writeFailed);
          render();
        };
        textEl.onkeydown = (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); };
        textEl.onblur = () => finish(true);
        setTimeout(() => { textEl.focus(); textEl.select(); }, 0);
      } else {
        textEl = document.createElement("span");
        textEl.className = "text"; textEl.textContent = t.title;
        textEl.title = "クリックで編集";
        textEl.onclick = () => { editingId = t.id; render(); };
      }

      const chip = dueChip(t.due, t.done) || document.createElement("span");
      const del = document.createElement("button");
      del.className = "del"; del.type = "button"; del.innerHTML = trashSvg;
      del.setAttribute("aria-label", "削除：" + t.title);
      del.onclick = () => store.remove(t.id).catch(writeFailed);
      li.append(cb, textEl, chip, del);
      list.append(li);
    }
  }

  // ---------- events ----------
  $("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = $("newTitle").value.trim();
    if (!title || !store) return;
    const t = { id: "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title, done: false, due: $("newDue").value || "", created: Date.now() };
    $("newTitle").value = ""; $("newDue").value = "";
    try { await store.add(t); setStatus(""); } catch (err) { writeFailed(); }
  });
  document.querySelectorAll(".filters [data-f]").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.f;
    document.querySelectorAll(".filters [data-f]").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    render();
  }));
  $("clearDone").addEventListener("click", async () => {
    for (const t of tasks.filter(x => x.done)) { try { await store.remove(t.id); } catch (e) { writeFailed(); break; } }
  });

  // ---------- boot ----------
  function start(adapter) {
    store = adapter;
    if (adapter.kind === "local") setStatus("この端末のブラウザにだけ保存されています。");
    else setStatus("あなたのアカウントに保存され、どの端末からでも同じリストが見られます。");
    adapter.subscribe((items) => { tasks = items.sort((a, b) => (a.created || 0) - (b.created || 0)); render(); });
  }
  render();
  (async () => {
    try {
      if (window.claude && window.claude.use) {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        const uid = user ? await user.id() : null;
        if (db && uid) return start(dbAdapter(db, uid));
      }
    } catch (e) {}
    start(localAdapter());
  })();
})();
</script>

</body>
</html>
